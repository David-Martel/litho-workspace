# CI workflow for litho-workspace
#
# Build matrix: windows-latest for the main Litho pipeline, plus
# an opt-in ubuntu-latest Postgres integration lane.
# tree-sitter grammars compile C code via the `cc` crate. The repo's
# .cargo/config.toml sets CC/CXX for the MSVC target to clang-cl.exe
# so Cargo avoids MinGW/shim collisions while still emitting MSVC-compatible
# objects and link behavior.

name: CI

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_postgres_integration:
        description: "Run opt-in Postgres integration tests"
        required: false
        type: boolean
        default: false
      run_live_benchmark:
        description: "Run opt-in live Ollama benchmark optimization lane"
        required: false
        type: boolean
        default: false
      benchmark_ollama_base_url:
        description: "Ollama base URL for live benchmark lane"
        required: false
        type: string
        default: "http://127.0.0.1:11434"
      benchmark_models:
        description: "Comma-separated model list for live benchmark lane"
        required: false
        type: string
        default: "qwen2.5-coder:3b,gemma3:12b"
      benchmark_context_windows:
        description: "Comma-separated context windows for live benchmark lane"
        required: false
        type: string
        default: "32768,131072"
      benchmark_num_predict:
        description: "Comma-separated num_predict values for live benchmark lane"
        required: false
        type: string
        default: "512,1024"

env:
  CARGO_TERM_COLOR: always
  # Deny warnings in CI to keep clippy output clean.
  RUSTFLAGS: "-D warnings"

jobs:
  # ---------------------------------------------------------------------------
  # build: compile, test, and lint the Litho crates only
  # ---------------------------------------------------------------------------
  build:
    name: Build / Test / Clippy
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize build stamp/token
        shell: pwsh
        run: |
          . ./scripts/litho-build-helpers.ps1
          $stamp = Set-LithoBuildStamp -ExportToGitHubEnv
          Write-Host "Build token: $($stamp.BuildToken)"

      # Install the stable Rust toolchain. dtolnay's action caches the
      # toolchain by default and correctly handles the MSVC target on Windows.
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # clippy is not bundled with stable by default in all environments;
          # requesting it explicitly guarantees it is present.
          components: clippy

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      # Cache compiled dependencies so that incremental CI runs are fast.
      # The cache key is keyed on the OS and the workspace Cargo.lock so that
      # adding or updating a dependency invalidates the cache correctly.
      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # Keep CI focused on Litho crates so external codex crates (for example
      # codex-tui) do not block default Litho build/test loops.
      - name: Build Litho crates (debug)
        run: cargo build -p litho-core -p litho-extract -p litho-codex -p litho-generator -p litho-cli -p litho-book -p litho-qmd-core -p litho-qmd-storage -p litho-qmd-llm -p litho-qmd-cli -p litho-qmd-mcp

      - name: Verify build token across binaries
        shell: pwsh
        run: pwsh -NoProfile -File scripts/verify-build-tokens.ps1

      - name: Run Litho crate tests with nextest (unit + integration except Postgres storage lane)
        run: cargo nextest run --profile ci --no-fail-fast -p litho-core -p litho-extract -p litho-codex -p litho-generator -p litho-cli -p litho-book -p litho-qmd-core -p litho-qmd-llm -p litho-qmd-cli -p litho-qmd-mcp

      - name: Run qmd-storage unit tests only with nextest
        run: cargo nextest run --profile ci --no-fail-fast -p litho-qmd-storage --lib

      - name: Run benchmark framework smoke test (dry-run optimize path)
        run: pwsh -NoProfile -File scripts/benchmark-ollama-optimize.ps1 -ProjectPath . -OutputDir ./.litho/benchmark-ci-smoke -Models "qwen2.5-coder:3b,gemma3:12b" -ContextWindows "32768,131072" -NumPredict "512,1024" -RunsPerCandidate 1 -WarmupRuns 0 -MaxCandidates 6 -RunTimeoutSeconds 60 -DryRun

      # Clippy is run as a separate step so its output is clearly visible in
      # the Actions log. RUSTFLAGS=-D warnings is already set at the job level,
      # but -D warnings is also passed on the command line for explicitness and
      # to ensure it applies even if the env var is overridden by a sub-crate.
      - name: Clippy (Litho crates, deny warnings)
        run: cargo clippy -p litho-core -p litho-extract -p litho-codex -p litho-generator -p litho-cli -p litho-book -p litho-qmd-core -p litho-qmd-storage -p litho-qmd-llm -p litho-qmd-cli -p litho-qmd-mcp -- -D warnings

  # ---------------------------------------------------------------------------
  # qmd-quality: focused quality gate for Rust-native qmd integration.
  # Runs coverage + benchmark framework on qmd crates and integration packages.
  # ---------------------------------------------------------------------------
  qmd-quality:
    name: QMD Coverage / Bench
    runs-on: windows-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize build stamp/token
        shell: pwsh
        run: |
          . ./scripts/litho-build-helpers.ps1
          $stamp = Set-LithoBuildStamp -ExportToGitHubEnv
          Write-Host "Build token: $($stamp.BuildToken)"

      - name: Install Rust stable + llvm-tools
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target-qmd-coverage
            target-qmd-bench
            coverage
          key: ${{ runner.os }}-qmd-quality-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-qmd-quality-
            ${{ runner.os }}-cargo-

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: QMD quality pipeline (tests + coverage + bench, integration skipped)
        run: pwsh -NoProfile -File scripts/qmd-quality.ps1 -SkipIntegration -BenchNoPlot

      - name: Upload QMD quality artifacts
        uses: actions/upload-artifact@v4
        with:
          name: qmd-quality-artifacts
          path: |
            coverage/qmd

  # ---------------------------------------------------------------------------
  # postgres-integration: explicit opt-in lane for DB-backed tests.
  # Runs only on manual workflow_dispatch when requested.
  # ---------------------------------------------------------------------------
  postgres-integration:
    name: Postgres Integration (opt-in)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_postgres_integration }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: qmd_index
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d qmd_index"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      CARGO_TERM_COLOR: always
      QMD_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/qmd_index

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Run Postgres integration tests
        run: cargo test -p litho-qmd-storage --test pipeline -- --nocapture

  # ---------------------------------------------------------------------------
  # live-ollama-benchmark: explicit opt-in lane for non-dry-run benchmark-optimize.
  # Runs only on manual workflow_dispatch when requested.
  # ---------------------------------------------------------------------------
  live-ollama-benchmark:
    name: Live Ollama Benchmark (opt-in)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_live_benchmark }}
    runs-on: windows-latest

    env:
      CARGO_TERM_COLOR: always
      LITHO_API_BASE_URL: ${{ inputs.benchmark_ollama_base_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize build stamp/token
        shell: pwsh
        run: |
          . ./scripts/litho-build-helpers.ps1
          $stamp = Set-LithoBuildStamp -ExportToGitHubEnv
          Write-Host "Build token: $($stamp.BuildToken)"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Verify Ollama is reachable
        shell: pwsh
        run: |
          $url = "${{ inputs.benchmark_ollama_base_url }}/api/tags"
          Write-Host "Checking Ollama endpoint: $url"
          $resp = Invoke-RestMethod -Method Get -Uri $url -TimeoutSec 30
          if (-not $resp -or -not $resp.models) {
            throw "Ollama is reachable but returned no models from /api/tags."
          }
          Write-Host ("Detected models: " + ($resp.models | ForEach-Object { $_.name } | Join-String -Separator ", "))

      - name: Run live benchmark optimization lane
        run: pwsh -NoProfile -File scripts/benchmark-ollama-optimize.ps1 -ProjectPath . -OutputDir ./.litho/benchmark-live-ci -Models "${{ inputs.benchmark_models }}" -ContextWindows "${{ inputs.benchmark_context_windows }}" -NumPredict "${{ inputs.benchmark_num_predict }}" -RunsPerCandidate 1 -WarmupRuns 1 -MaxCandidates 6 -RunTimeoutSeconds 180 -GateMinSuccessRate 1.0 -GateMinQuality 0.55 -GateMaxP95Seconds 120 -KeepCache -RetainArtifacts

      - name: Upload live benchmark artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-live-artifacts
          path: |
            .litho/benchmark-live-ci

  # ---------------------------------------------------------------------------
  # release: build the CLI binary and upload it to a GitHub Release.
  # Only runs when a version tag (v*) is pushed.
  # ---------------------------------------------------------------------------
  release:
    name: Release (litho-cli)
    runs-on: windows-latest
    needs: build
    # Guard: only execute on version tags, never on branch pushes or PRs.
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      # softprops/action-gh-release needs write access to create the release
      # and upload assets.
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize build stamp/token
        shell: pwsh
        run: |
          . ./scripts/litho-build-helpers.ps1
          $stamp = Set-LithoBuildStamp -ExportToGitHubEnv
          Write-Host "Build token: $($stamp.BuildToken)"

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-
            ${{ runner.os }}-cargo-

      # Build only the CLI crate in release mode.  -p litho-cli restricts the
      # build to the binary crate and its transitive dependencies only.
      - name: Build release binary (litho-cli)
        run: cargo build --release -p litho-cli

      # softprops/action-gh-release creates (or updates) the GitHub Release for
      # the current tag and attaches the specified files as release assets.
      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: target/release/litho.exe
          # Generate a minimal release body from the tag annotation if present.
          generate_release_notes: true
