name: Vendor Codex Verify

on:
  workflow_dispatch:
  schedule:
    # Weekly audit of vendored codex-rs compatibility.
    - cron: "0 7 * * 1"

env:
  CARGO_TERM_COLOR: always

jobs:
  codex-vendor-verify:
    name: Vendored codex-rs compatibility
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-vendor-codex-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-vendor-codex-
            ${{ runner.os }}-cargo-

      # Keep codex-rs verification separate from Litho release gating.
      - name: Check codex-rs CLI/TUI crates
        run: cargo check -p codex-cli -p codex-tui
