[package]
name = "litho-generator"
version.workspace = true
edition.workspace = true
description = "Legacy rig-based documentation generation pipeline (deepwiki-rs)"
license = "MIT"

[[bin]]
name = "litho-generator"
path = "src/main.rs"

[dependencies]
litho-core = { workspace = true }
rig-core = "0.23"
reqwest = { version = "0.12" }
tokio = { workspace = true }
anyhow = { workspace = true }
thiserror = "2.0"
serde = { workspace = true }
serde_json = { workspace = true }
schemars = "1"
clap = { workspace = true }
toml = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
walkdir = "2.5"
regex = "1.11"
md-5 = "0.10"
base64 = "0.22"
pdf-extract = "0.7"
async-trait = { workspace = true }
rand = "0.9"
pathdiff = "0.2.3"
markdown = "1.0"
futures = "0.3"
uuid = { version = "1.0", features = ["v4", "serde"] }
glob = "0.3"
