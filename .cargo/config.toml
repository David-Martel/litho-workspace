[build]
rustc-wrapper = "sccache"
target-dir = "target"

[env]
SCCACHE_DIR = ".cache/sccache"
NEXTEST_RETRY_DATA_DIR = ".cache/nextest"
CARGO_INCREMENTAL = "1"

[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"
rustflags = [
    "-C", "target-cpu=native",
]

[profile.dev]
split-debuginfo = "packed"

[profile.release]
split-debuginfo = "packed"
# lto = "thin" — disabled: causes rustc stack overflow on rig-core 0.23
# codegen-units = 4
codegen-units = 16
