[build]
rustc-wrapper = "sccache"
target-dir = "target"

[env]
SCCACHE_DIR = ".cache/sccache"
NEXTEST_RETRY_DATA_DIR = ".cache/nextest"
CARGO_INCREMENTAL = "1"

[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"
rustflags = [
    "-C", "target-cpu=native",
]

[profile.dev]
split-debuginfo = "packed"
codegen-units = 256
# Reduce per-unit object size to prevent rust-lld OOM on large binaries (codex-tui)
# Trade: slightly slower runtime in dev, but builds succeed

[profile.release]
split-debuginfo = "packed"
lto = "thin"
codegen-units = 16
