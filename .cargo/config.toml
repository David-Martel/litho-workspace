# Litho workspace Cargo configuration
#
# Inherits from ~/.cargo/config.toml (global) which provides:
#   - sccache wrapper, T:\RustCache target-dir, CARGO_INCREMENTAL=0
#   - jobs=2, sparse registry, net retry, profile overrides
#
# This file provides workspace-specific overrides only.

[build]
rustc-wrapper = "sccache"

[target.x86_64-pc-windows-msvc]
linker = "rust-lld.exe"
rustflags = [
    "-C", "target-cpu=native",
]

[profile.dev]
split-debuginfo = "packed"
codegen-units = 256
# codex-tui OOM prevention: many small compilation units
# CARGO_INCREMENTAL must stay 0 (global config) for sccache compatibility

[profile.release]
split-debuginfo = "packed"
lto = "thin"
codegen-units = 16
